    />

    <meta name="theme-color" content="#060a18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fc" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jayanth Sadurla | AI/ML Developer, Data Scientist, Software Developer" />

      property="og:description"
      content="Building intelligent systems with data, AI, and code. Projects in generative AI, machine learning, data science and full-stack development."
    />
    <meta name="color-scheme" content="dark light" />
    <style>html[data-theme="dark"]{background:#060a18}html[data-theme="light"]{background:#f5f7fc}</style>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Saved choice wins; otherwise follow the system preference.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
